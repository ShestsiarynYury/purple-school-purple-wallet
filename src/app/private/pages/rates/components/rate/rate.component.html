@let data = this.data();

@if (data) {
	<div class="rate__card">
		<div class="rate__icon"><img [ngSrc]="data.logoUrl" [alt]="data.assetName" /></div>
		<div class="rate__name">
			<div class="rate__name--full">{{ data.assetName }}</div>
			<div class="rate__name--short">{{ data.assetId }}</div>
		</div>
		<div class="rate__rate-change">
			<div class="rate__rate-change-icon">
				<div class="asset__rate-change">
					@if (data.rateChange > 0) {
						<img ngSrc="/icons/arrow-up.svg" width="15px" height="15px" alt="up arrow" />
					} @else {
						<img ngSrc="/icons/arrow-down.svg" width="15px" height="15px" alt="down arrow" />
					}
				</div>
			</div>
		</div>
		<div class="rate__value">{{ data.course }}</div>
		<div
			class="rate__rate"
			[ngClass]="{
				'asset__rate--success': data.rateChange > 0,
				'asset__rate--danger': data.rateChange <= 0,
			}"
		>
			{{ data.rateChange / 100 | percent: "1.2-2" }}
		</div>
	</div>
}
